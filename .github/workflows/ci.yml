name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt --requirement requirements-dev.txt

      - name: Lint
        run: ruff check --output-format=github .

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run CLI smoke test
        run: >-
          python src/nmap_to_zabbix.py
          --input examples/nmap/synthetic-enterprise.xml
          --output-dir output/ci

      - name: Verify generated artifacts
        shell: bash
        run: |
          test -s output/ci/network-review.md
          test -s output/ci/network-review.json
          test -s output/ci/dashboard.html

  required-status:
    name: test
    if: ${{ always() }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify matrix result
        env:
          MATRIX_RESULT: ${{ needs.quality.result }}
        run: test "$MATRIX_RESULT" = "success"
