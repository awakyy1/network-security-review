name: Bug report
description: Report reproducible behavior using synthetic or sanitized data only.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach credentials, personal data or real infrastructure scans.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide commands and a synthetic or sanitized XML fixture.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version or commit
      placeholder: 9dd9026
    validations:
      required: true
  - type: dropdown
    id: authorized
    attributes:
      label: Data confirmation
      options:
        - The attached data is synthetic or fully sanitized
    validations:
      required: true
